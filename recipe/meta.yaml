{% set version = "5.4.8" %}

package:
  name: lua
  version: {{ version }}

source:
  - url: https://www.lua.org/ftp/lua-{{ version }}.tar.gz
    sha256: 4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae
  - path: CMakeLists.txt

build:
  number: 0
  # Temporary 5.4.8 rebuild: win-64 is missing on defaults; abs.yaml --skip-existing skips unix.

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - ninja  # [win]
    - cmake  # [win]
    - make  # [unix]
  host:
    - readline  # [unix]
    - ncurses  # [unix]
  run:
    - readline  # [unix]
    - ncurses  # [unix]

test:
  commands:
    - test -f $PREFIX/bin/lua                       # [unix]
    - test -f $PREFIX/bin/luac                      # [unix]
    - test -f $PREFIX/lib/liblua.a                  # [unix]
    - test -f $PREFIX/include/lua.h                 # [unix]
    - if not exist %LIBRARY_BIN%\\lua.dll exit 1    # [win]
    - if not exist %LIBRARY_BIN%\\lua.exe exit 1    # [win]
    - if not exist %LIBRARY_BIN%\\luac.exe exit 1   # [win]
    - if not exist %LIBRARY_LIB%\\lua.lib exit 1    # [win]
    - if not exist %LIBRARY_INC%\\lua.h exit 1      # [win]
    - lua -v
    - lua -e "print(\"Lua path:\" .. package.path)"
    - lua -e "print(\"Lua cpath:\" .. package.cpath)"

about:
  home: https://www.lua.org/
  summary: Lua is a powerful, fast, lightweight, embeddable scripting language
  license: MIT
  license_family: MIT
  license_url: https://www.lua.org/license.html
  doc_url: https://www.lua.org/docs.html
  dev_url: https://www.lua.org/source/
  description: |
    Lua is a powerful, efficient, lightweight, embeddable scripting language.
    It supports procedural programming, object-oriented programming, functional 
    programming, data-driven programming, and data description.

extra:
  recipe-maintainers:
    - alexbw
